{{ with .data -}}
    {{ if $.weekday }}
        {{ $weekday := .Date | weekday -}}
        {{ if $weekday -}}
            {{ $weekday }}
        {{- end -}}
    {{- end }}
    {{ with .Date -}}
        {{ if eq (len .) 10 -}} den {{ end -}}
        {{ . | formatDateText -}} 
    {{ end -}}
    {{ with .Place }}
        {{ . -}}
    {{ end -}}
{{ end -}}
